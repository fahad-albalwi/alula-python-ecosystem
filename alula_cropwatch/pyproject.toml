[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alula-cropwatch"
version = "0.1.0"
description = "Agricultural vegetation indices and field summaries for AlUla"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FAHAD SAAD ALBALWI"}]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
keywords = ["AlUla", "Saudi Arabia", "Agricultural crop monitoring"]

[tool.setuptools.packages.find]
where = ["."]
include = ["alula_cropwatch*"]
